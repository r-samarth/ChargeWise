services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chargewise-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chargewise}
      POSTGRES_USER: ${POSTGRES_USER:-chargewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chargewise_dev_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chargewise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chargewise} -d ${POSTGRES_DB:-chargewise}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chargewise_pgdata:
